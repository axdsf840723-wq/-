<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>엘비프린텍 바코드 · QR 생성기</title>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--blue:#1268b3;--deep:#123a70;--line:#d5deea;--ink:#182536;--muted:#64748b}
*{box-sizing:border-box}body{margin:0;font-family:"Malgun Gothic",Arial,sans-serif;background:linear-gradient(125deg,#142c61,#087fc0);color:var(--ink);min-height:100vh}
header{height:72px;color:white;display:flex;align-items:center;justify-content:center;gap:14px;font-size:22px;font-weight:800;letter-spacing:-.5px}.brand-logo{width:58px;height:48px;object-fit:contain;background:#fff;border-radius:4px;padding:2px}
header span{font-size:25px;margin-right:9px}
.shell{max-width:1220px;margin:8px auto 30px;padding:0 16px}
.workspace{display:grid;grid-template-columns:220px minmax(400px,1fr) 210px;background:#f4f7fb;border-radius:8px;overflow:hidden;min-height:690px;box-shadow:0 16px 45px #001b3d55}
.left,.center,.right{padding:16px;border-right:1px solid var(--line);min-width:0}.right{border:0;background:#fff}
.left{background:#f8fafc}.center{background:#f2f6fb}
h2{font-size:15px;margin:0 0 12px;font-weight:800}
.search{width:100%;border:1px solid var(--line);border-radius:6px;padding:10px;font-size:12px;margin-bottom:12px}
.group{font-size:11px;color:#65758b;font-weight:700;margin:12px 0 7px}
.types{display:grid;gap:7px;max-height:555px;overflow:auto;padding-right:3px}
.type{border:1px solid #d8e0ea;background:white;border-radius:7px;padding:8px 7px;cursor:pointer;text-align:center;color:#344256;font-size:11px}
.type:hover,.type.active{border:2px solid #2584d7;background:#edf6ff;padding:7px 6px}
.sample{height:46px;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:4px;color:#111;background:#fff;border-radius:4px;padding:3px}
.sample svg{max-width:100%;max-height:40px;width:auto;height:auto}
.sample canvas,.sample img{max-width:100%;max-height:40px;width:auto;height:auto;image-rendering:pixelated}
.qrmini{width:30px;height:30px;border:4px solid #111;background:repeating-conic-gradient(#111 0 25%,white 0 50%) 0/8px 8px}
.small{font-size:11px;color:var(--muted);line-height:1.5}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.toolbar .actions{display:flex;gap:7px;align-items:center}
button,.filebtn{border:1px solid #cbd5e1;background:white;border-radius:6px;padding:8px 11px;font-size:12px;cursor:pointer;font-weight:700;color:#334155}
button:hover,.filebtn:hover{background:#eaf3ff;border-color:#8ab8e8}
.primary{background:linear-gradient(100deg,#3868f5,#c72b86);border:0;color:#fff;padding:10px 18px}
.primary:hover{filter:brightness(1.05);background:linear-gradient(100deg,#3868f5,#c72b86)}
textarea{width:100%;height:92px;resize:vertical;border:1px solid #cbd5e1;border-radius:6px;padding:11px;font:12px/1.6 Consolas,monospace;background:white}
.tip{font-size:11px;color:#77869a;margin:6px 0 15px}
.section-title{font-weight:800;font-size:14px;margin:13px 0 8px}
.preview{height:390px;border:1px solid #cbd6e4;border-radius:7px;background:#eaf1fa;display:flex;align-items:center;justify-content:center;overflow:auto;padding:20px}
#output{background:white;min-width:120px;min-height:100px;display:flex;align-items:center;justify-content:center;padding:10px}
#output svg{max-width:100%;height:auto}
#output canvas,#output img{max-width:100%;height:auto;image-rendering:pixelated}
.status{min-height:20px;margin-top:9px;font-size:12px;color:#b42318}
.field{margin-bottom:13px}.field label{display:flex;justify-content:space-between;font-size:11px;font-weight:700;margin-bottom:6px}
input[type=number],select{width:100%;padding:8px;border:1px solid #cbd5e1;border-radius:5px;background:white;font-size:12px}
input[type=checkbox]{accent-color:#1976d2}
.toggle{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;margin:2px 0 16px}
.downloads{border-top:1px solid var(--line);padding-top:14px;margin-top:17px;display:grid;gap:8px}
.downloads button{width:100%}
.note{font-size:10px;color:#77869a;line-height:1.5;margin-top:14px}
.hidden{display:none!important}
@media(max-width:900px){.workspace{grid-template-columns:185px minmax(300px,1fr)}.right{grid-column:1/-1;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.right h2,.right .downloads,.right .note{grid-column:1/-1}.left{border-right:1px solid var(--line)}}
@media(max-width:620px){header{font-size:16px;gap:9px}.brand-logo{width:46px;height:38px}.workspace{display:block}.left,.center,.right{border:0;border-bottom:1px solid var(--line)}.types{max-height:230px;grid-template-columns:repeat(3,1fr)}.right{display:block}.preview{height:300px}}
</style>
</head>

<div class="shell">
<div class="workspace">
<aside class="left">
  <h2>바코드 형식 선택</h2>
  <input class="search" id="typeSearch" placeholder="⌕  바코드 형식 검색...">
  <div class="group">바코드 유형 목록</div>
  <div class="types" id="typeList"></div>
</aside>

<main class="center">
  <div class="toolbar">
    <h2 style="margin:0">바코드 값 (한 줄에 하나씩)</h2>
    <div class="actions">
      <label class="filebtn" for="csvFile">Import CSV ⤒</label>
      <input id="csvFile" type="file" accept=".csv,.txt" class="hidden">
      <button id="clearBtn">비우기</button>
    </div>
  </div>
  <textarea id="values" spellcheck="false">https://lbprinttek.co.kr</textarea>
  <div class="tip">여러 데이터를 입력하면 한 줄씩 구분합니다. CSV/TXT 파일을 불러올 수도 있습니다.</div>
  <div class="toolbar">
    <div class="section-title" style="margin:4px 0">출력 미리보기</div>
    <div class="actions"><button id="prevBtn">이전</button><span class="small" id="counter">1 / 1</span><button id="nextBtn">다음</button></div>
  </div>
  <div class="preview"><div id="output"></div></div>
  <div class="status" id="status" role="status">준비되었습니다.</div>
</main>

<aside class="right">
  <h2>옵션</h2>
  <div>
    <div class="toggle"><span>디스플레이 텍스트</span><input type="checkbox" id="showText" checked></div>
    <div class="field"><label for="width">최대 표시 너비 (px)</label><input type="number" id="width" min="100" max="1200" value="420"></div>
    <div class="field" id="heightField"><label for="height">바코드 높이 (px)</label><input type="number" id="height" min="30" max="400" value="110"></div>
    <div class="field" id="barWidthField"><label for="barWidth">바코드 굵기 (px)</label><input type="number" id="barWidth" min="1" max="5" value="2"></div>
    <div class="field"><label for="margin">여백 (px)</label><input type="number" id="margin" min="0" max="60" value="10"></div>
    <div class="field" id="qrLevelField"><label for="qrLevel">QR 오류 복원 수준</label><select id="qrLevel"><option value="L">L - 약 7%</option><option value="M" selected>M - 약 15%</option><option value="Q">Q - 약 25%</option><option value="H">H - 약 30%</option></select></div>
    <div class="field" id="qrZoomField">
      <label for="qrZoom"><span>QR 미리보기 크기</span><strong id="qrZoomValue">100%</strong></label>
      <input type="range" id="qrZoom" min="30" max="100" step="5" value="100" style="width:100%;accent-color:#1976d2">
      <div class="small">미리보기 화면만 축소·확대합니다. 저장되는 QR 이미지의 원본 크기에는 영향을 주지 않습니다.</div>
    </div>
  </div>
  <div class="downloads">
    <button class="primary" id="pngBtn">⬇ PNG 다운로드</button>
    <button id="svgBtn">SVG 다운로드</button>
    <button id="printBtn">인쇄</button>
  </div>
  <div class="note">※ 실제 사용 전 스캐너로 테스트하세요. EAN/UPC 등 표준 상품 코드는 정식 발급된 번호를 사용해야 합니다.</div>
</aside>

<script>
const formats=[
 ['CODE128','Code 128','일반 문자와 숫자'],['CODE128A','Code 128A','대문자·제어문자'],['CODE128B','Code 128B','문자·숫자'],['CODE128C','Code 128C','숫자 짝수 자리'],
 ['EAN13','EAN-13','숫자 12자리 입력'],['EAN8','EAN-8','숫자 7자리 입력'],['UPC','UPC-A','숫자 11자리 입력'],['CODE39','Code 39','영문 대문자·숫자'],['ITF14','ITF-14','숫자 13자리 입력'],['ITF','Interleaved 2 of 5','숫자 짝수 자리'],['MSI','MSI','숫자'],['pharmacode','Pharmacode','숫자 3~131070'],['QR','QR Code','URL·한글·영문·숫자']
];
let current='QR',index=0;
const $=id=>document.getElementById(id);
const values=()=>$('values').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
function makeTypeList(filter=''){
 $('typeList').innerHTML='';
 formats.filter(f=>(f[1]+' '+f[2]).toLowerCase().includes(filter.toLowerCase())).forEach(f=>{
  const b=document.createElement('button');b.className='type'+(current===f[0]?' active':'');
  const sample=document.createElement('div');sample.className='sample';
  // 각 항목에 장식용 줄무늬가 아닌 실제 규격의 샘플 코드를 렌더링합니다.
  const demoValues={
   CODE128:'LB123456', CODE128A:'ABC123', CODE128B:'Label123',
   CODE128C:'12345678', EAN13:'880123456789', EAN8:'1234567',
   UPC:'01234567890', CODE39:'LB-123', ITF14:'1234567890123',
   ITF:'12345678', MSI:'12345678', pharmacode:'12345'
  };
  if(f[0]==='QR'){
   const q=document.createElement('div');q.style.width='39px';q.style.height='39px';q.style.background='#fff';sample.append(q);
   if(window.QRCode) new QRCode(q,{text:'https://lbprinttek.co.kr',width:39,height:39,colorDark:'#000',colorLight:'#fff',correctLevel:QRCode.CorrectLevel.M});
  }else if(window.JsBarcode){
   const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');sample.append(svg);
   try{JsBarcode(svg,demoValues[f[0]],{format:f[0],width:1,height:30,displayValue:false,margin:1,lineColor:'#111',background:'#fff'});}
   catch(err){sample.textContent=f[1];}
  }else{
   const t=document.createElement('span');t.textContent='바코드';sample.append(t);
  }
  const name=document.createElement('b');name.textContent=f[1];
  const desc=document.createElement('div');desc.className='small';desc.textContent=f[2];
  b.append(sample,name,desc);b.onclick=()=>{current=f[0];index=0;makeTypeList($('typeSearch').value);updateOptions();render()};
  $('typeList').append(b);
 });
}
function updateOptions(){
 const qr=current==='QR';
 ['heightField','barWidthField','qrLevelField','qrZoomField'].forEach(id=>$(id).classList.toggle('hidden',(id==='qrLevelField'||id==='qrZoomField')?!qr:qr));
 $('showText').disabled=qr;
}
function render(){
 const data=values();if(index>=data.length)index=Math.max(0,data.length-1);
 $('counter').textContent=(data.length?index+1:0)+' / '+data.length;
 $('output').innerHTML='';
 if(!data.length){$('status').textContent='데이터를 입력해 주세요.';return}
 const val=data[index],out=$('output');
 try{
  if(current==='QR'){
   if(!window.QRCode)throw Error('QR 생성 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인하세요.');
   const box=document.createElement('div');out.append(box);
   const size=Math.max(120,Math.min(650,Number($('width').value)||260));
   const level={L:QRCode.CorrectLevel.L,M:QRCode.CorrectLevel.M,Q:QRCode.CorrectLevel.Q,H:QRCode.CorrectLevel.H}[$('qrLevel').value];
   new QRCode(box,{text:val,width:size,height:size,colorDark:'#000',colorLight:'#fff',correctLevel:level});
   box.style.transform='scale('+(Number($('qrZoom').value)/100)+')';
   box.style.transformOrigin='center center';
  }else{
   if(!window.JsBarcode)throw Error('바코드 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인하세요.');
   const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');out.append(svg);
   JsBarcode(svg,val,{format:current,width:Math.max(1,Math.min(5,Number($('barWidth').value)||2)),height:Math.max(30,Number($('height').value)||110),displayValue:$('showText').checked,font:'Arial',fontSize:14,margin:Math.max(0,Number($('margin').value)||0),lineColor:'#000',background:'#fff'});
   svg.style.maxWidth=Math.min(100,Number($('width').value)||420)+'%';
  }
  $('status').style.color='#187444';$('status').textContent='생성 완료 · '+val;
 }catch(e){$('status').style.color='#b42318';$('status').textContent='생성 오류: '+e.message;out.innerHTML=''}
}
function download(name,type){
 render();const out=$('output');
 if(!out.firstChild)return;
 if(current==='QR'){
  const canvas=out.querySelector('canvas');
  if(canvas){canvas.toBlob(blob=>save(blob,name+'.png'),'image/png');return}
  const im=out.querySelector('img');if(im){const c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;c.getContext('2d').drawImage(im,0,0);c.toBlob(b=>save(b,name+'.png'));return}
 }
 const svg=out.querySelector('svg');if(!svg)return;
 if(type==='svg'){const copy=svg.cloneNode(true);copy.setAttribute('xmlns','http://www.w3.org/2000/svg');save(new Blob([new XMLSerializer().serializeToString(copy)],{type:'image/svg+xml'}),name+'.svg')}
 else{const src=new XMLSerializer().serializeToString(svg),url=URL.createObjectURL(new Blob([src],{type:'image/svg+xml'})),im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=im.width*3;c.height=im.height*3;const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(im,0,0,c.width,c.height);c.toBlob(b=>{save(b,name+'.png');URL.revokeObjectURL(url)})};im.src=url}
}
function save(blob,name){if(!blob)return;const a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1200)}
$('typeSearch').addEventListener('input',e=>makeTypeList(e.target.value));
$('values').addEventListener('input',()=>{index=0;render()});
['showText','width','height','barWidth','margin','qrLevel'].forEach(id=>$(id).addEventListener('change',render));
$('qrZoom').addEventListener('input',e=>{$('qrZoomValue').textContent=e.target.value+'%';render()});
$('prevBtn').onclick=()=>{index=Math.max(0,index-1);render()};
$('nextBtn').onclick=()=>{index=Math.min(values().length-1,index+1);render()};
$('clearBtn').onclick=()=>{$('values').value='';index=0;render()};
$('pngBtn').onclick=()=>download('barcode-'+(index+1),'png');
$('svgBtn').onclick=()=>{if(current==='QR'){download('qrcode-'+(index+1),'png');$('status').textContent='QR 코드는 PNG 형식으로 저장됩니다.'}else download('barcode-'+(index+1),'svg')};
$('printBtn').onclick=()=>{render();window.print()};
$('csvFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;$('values').value=(await f.text()).replace(/^\uFEFF/,'').split(/\r?\n/).map(line=>line.split(',')[0].replace(/^"|"$/g,'').trim()).filter(Boolean).join('\n');index=0;render();e.target.value=''};
makeTypeList();updateOptions();render();
</script>
